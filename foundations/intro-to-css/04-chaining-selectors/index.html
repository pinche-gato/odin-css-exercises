<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaining Selectors</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <!-- Use the classes BELOW this line -->
    <div>
      <img class="avatar proportioned" src="./images/cat3.jpg" alt="tabby cat with grey and white fur with blue eys in a black background">
      <img class="avatar distorted" src="./images/cat2.jpg" alt="domestic short-hair cat with white and black fur with green eyes in a green background and cat's paws on bamboo">
    </div>
    <!-- Use the classes ABOVE this line -->
    <div>
      <img class="original1 proportioned" src="./images/cat3.jpg" alt="tabby cat with grey and white fur with blue eys in a black background">
      <img class="original2 distorted" src="./images/cat2.jpg" alt="Man with surprised expression"> 
    </div>
  </body>
</html>
